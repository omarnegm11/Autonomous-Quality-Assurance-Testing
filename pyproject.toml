[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "qa-agent-poc"
version = "0.1.0"
description = "Evidence-driven cooperative QA agents and a real test application"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[project.scripts]
qa-poc = "qa_poc.cli:main"

[tool.setuptools.packages.find]
include = ["qa_poc*"]

[tool.setuptools.package-data]
qa_poc = ["application/*.html", "application/*.js", "dashboard_assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
